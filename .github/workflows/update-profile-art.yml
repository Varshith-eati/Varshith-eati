name: Update profile art

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC / 11:47 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile-art.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'data/profile.json'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test contribution parser
        run: python -m unittest discover -s tests -v
      - name: Fetch public contributions and render SVG
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
      - name: Commit refreshed art
        run: |
          git add data/contributions.json contrib-heatmap.svg info-card.svg
          if git diff --cached --quiet; then
            echo "Profile art is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile art [skip ci]"
          git push origin HEAD:main
